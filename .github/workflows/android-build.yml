name: Android Build & APK Release

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'APK_DOWNLOAD/**'
      - '.build-outputs/**'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Debug Keystore Exists
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug keystore..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            gradle wrapper
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate & Verify Generated APK
        id: locate-apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::No APK file found in app/build/outputs/apk/debug"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Stage APK Files & Validate Integrity
        run: |
          APK_PATH="${{ steps.locate-apk.outputs.apk_path }}"
          mkdir -p .build-outputs
          mkdir -p APK_DOWNLOAD

          cp "$APK_PATH" .build-outputs/app-debug.apk
          cp "$APK_PATH" APK_DOWNLOAD/app-debug.apk

          echo "=== File Details ==="
          ls -lh .build-outputs/app-debug.apk
          ls -lh APK_DOWNLOAD/app-debug.apk

          echo "=== File Type ==="
          file APK_DOWNLOAD/app-debug.apk

          echo "=== Unzip Verification ==="
          unzip -t APK_DOWNLOAD/app-debug.apk

          echo "=== Size Verification ==="
          SIZE1=$(stat -c%s .build-outputs/app-debug.apk)
          SIZE2=$(stat -c%s APK_DOWNLOAD/app-debug.apk)
          if [ "$SIZE1" -le 1048576 ]; then
            echo "::error::Generated APK size ($SIZE1 bytes) is suspiciously small. Real Android APK expected."
            exit 1
          fi

          echo "=== SHA256 Verification ==="
          HASH1=$(sha256sum .build-outputs/app-debug.apk | awk '{print $1}')
          HASH2=$(sha256sum APK_DOWNLOAD/app-debug.apk | awk '{print $1}')
          echo "SHA256 (.build-outputs): $HASH1"
          echo "SHA256 (APK_DOWNLOAD):  $HASH2"

          if [ "$HASH1" != "$HASH2" ]; then
            echo "::error::SHA256 checksums do not match between staged APK files!"
            exit 1
          fi
          echo "APK Integrity Check Passed Successfully."

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: APK_DOWNLOAD/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Commit & Push APK to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .build-outputs/app-debug.apk
          git add -f APK_DOWNLOAD/app-debug.apk
          if git diff --cached --quiet; then
            echo "No APK changes to commit."
          else
            git commit -m "build: update debug APK [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
